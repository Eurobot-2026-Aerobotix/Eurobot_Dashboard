<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Strategy Viewer</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #1e1e2f;
    color: #e0e0e0;
    display: flex;
    height: 100vh;
  }

  /* Side panel */
  #side-panel {
    width: 300px;
    background-color: #2b2b3f;
    overflow-y: auto;
    padding: 10px;
    border-right: 2px solid #444;
  }

  .action-item {
    background-color: #3a3a5a;
    padding: 8px;
    margin-bottom: 5px;
    border-radius: 6px;
    cursor: grab;
  }

  .action-item.dragging {
    opacity: 0.5;
  }

  /* Main area */
  #main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: start;
    padding: 10px;
  }

  #map-container {
    background-color: #1110;
    width: 90%;
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 10px;
  }
  img{
    box-shadow: 0 0 15px gray;
  }

  #map-container img {
    max-width: 100%;
    max-height: 100%;
  }

  #controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  select, button {
    padding: 5px 10px;
    border-radius: 6px;
    border: none;
    background-color: #3a3a5a;
    color: #e0e0e0;
    cursor: pointer;
  }

  select {
    min-width: 150px;
  }

  button:hover {
    background-color: #4a4a7a;
  }
  .task-box {
    border: 1px solid #555;
    border-radius: 8px;
    padding: 5px;
    margin-bottom: 10px;
    background-color: #2b2b3f;
  }

  .task-legend {
    font-weight: bold;
    margin-bottom: 5px;
    color: #f0f0f0;
  }

  .action-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
</style>
</head>
<body>

  <!-- Side panel: all actions -->
  <div id="side-panel"></div>

  <!-- Main area -->
  <div id="main-area">
    <div id="map-container">
      <img src="resources/map.png" alt="Map">
    </div>
    <div id="controls">
      <select id="action-select">
        <option value="">Add</option>
      </select>
      <button id="add-action-btn">Add</button>
      <button id="back-btn">Back</button>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
<script type="module" src="viewer_controller.js"></script>
</body>
</html>
