<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategy Viewer</title>
<link href="../css/home.css" rel="stylesheet">
<link href="../css/viewer_style.css" rel="stylesheet">
<link rel="icon" type="image/png" href="../resources/harissa.png">
</head>
<body>

  <nav class="navbar">
    <div class="nav-content">
      <a href="index.html" class="nav-link">Home</a>
      <a href="strategy_selector.html" class="nav-link active">Strategy</a>
      <a href="pathfinding_simulation.html" class="nav-link">Pathfinding</a>
      <a href="realtime_robot.html" class="nav-link">Real-Time</a>
      <a href="test_controller.html" class="nav-link">TEST</a>
      <img src="../resources/AeRobotix.png" alt="AeRobotix Logo" class="nav-logo">
    </div>
  </nav>

  <!-- Side panel: all actions -->
  <div id="side-panel"></div>

  <!-- Main area -->
  <div id="main-area">  
    <div id="map-container">
      <div id="map-wrapper">
        <img src="../resources/map.png" id="map" alt="Map">
        <svg id="map-overlay"></svg>
      </div>
    </div>
    <div id="controls">
      <div id="pami-selector">
        <label style="font-weight: bold; margin-right: 10px;">Select PAMIs:</label>
        <label class="pami-checkbox-label" style="font-weight: bold; background-color: rgba(102, 126, 234, 0.2); padding: 8px 12px; border-radius: 5px;">
          <input type="checkbox" id="pami-all-checkbox">
          <span style="font-size: 16px;">ALL</span>
        </label>
        <label class="pami-checkbox-label">
          <input type="checkbox" class="pami-checkbox" data-pami="1" checked>
          <span class="pami-color-indicator" style="background-color: #FF6B6B;"></span>
          PAMI 1
        </label>
        <label class="pami-checkbox-label">
          <input type="checkbox" class="pami-checkbox" data-pami="2">
          <span class="pami-color-indicator" style="background-color: #4ECDC4;"></span>
          PAMI 2
        </label>
        <label class="pami-checkbox-label">
          <input type="checkbox" class="pami-checkbox" data-pami="3">
          <span class="pami-color-indicator" style="background-color: #FFE66D;"></span>
          PAMI 3
        </label>
        <label class="pami-checkbox-label">
          <input type="checkbox" class="pami-checkbox" data-pami="4">
          <span class="pami-color-indicator" style="background-color: #95E1D3;"></span>
          PAMI 4
        </label>
        <label class="pami-checkbox-label">
          <input type="checkbox" class="pami-checkbox" data-pami="5">
          <span class="pami-color-indicator" style="background-color: #F38181;"></span>
          PAMI 5
        </label>
        <label class="pami-checkbox-label">
          <input type="checkbox" class="pami-checkbox" data-pami="6">
          <span class="pami-color-indicator" style="background-color: #AA96DA;"></span>
          PAMI 6
        </label>
        <label class="pami-checkbox-label">
          <input type="checkbox" class="pami-checkbox" data-pami="7">
          <span class="pami-color-indicator" style="background-color: #FCBAD3;"></span>
          PAMI 7
        </label>
      </div>
      <div style="margin-top: 10px;">
        &nbsp;&nbsp;&nbsp;&nbsp; Action :
        <select id="action-select">
          <option value="">Add</option>
        </select>
        <button id="add-action-btn">Add</button>
        <button id="zoom-btn">Zoom</button>
        <button id="back-btn">Back</button>
      </div>
    </div>
  </div>
  <div id="action-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Add Action</h3>

      <label id="command_label">
        Command
      </label>

      <div id="pami-selector-modal" class="hidden" style="margin: 15px 0;">
        <label style="font-weight: bold; margin-right: 10px;">Add to PAMI:</label>
        <select id="pami-select-modal">
          <option value="1">PAMI 1</option>
          <option value="2">PAMI 2</option>
          <option value="3">PAMI 3</option>
          <option value="4">PAMI 4</option>
          <option value="5">PAMI 5</option>
          <option value="6">PAMI 6</option>
          <option value="7">PAMI 7</option>
        </select>
      </div>

      <div id="args-container"></div>

      <div class="modal-buttons">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-confirm">Confirm</button>
      </div>
    </div>
  </div>
  <div id="action-context-menu" class="context-menu hidden">
    <div id="ctx-modify">Modify</div>
    <div id="ctx-delete">Delete</div>
  </div>
    <script src="../js/config.js?v=7"></script>
    <script src="../js/lib/js-yaml.min.js"></script>
    <script type="module" src="../js/pami_strategy_viewer_controller.js?v=7"></script>
</body>
</html>
