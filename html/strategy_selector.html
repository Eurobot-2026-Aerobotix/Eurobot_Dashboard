<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Strategy Selector</title>
    <style>
    /* Dark theme */
    body {
        background-color: #1e1e2f;
        color: #e0e0e0;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .container {
        background-color: #2b2b3f;
        padding: 30px;
        border-radius: 12px;
        width: 400px;
        box-shadow: 0 0 20px rgba(0,0,0,0.7);
        text-align: center;
    }

    h1 {
        margin-bottom: 20px;
        font-size: 24px;
        color: #f0f0f0;
    }
    .strategy-lists-container {
    display: flex;           /* align children horizontally */
    gap: 20px;               /* space between the divs */
    justify-content: center; /* optional: center them horizontally */
    }

    #strategy-list-yellow,  #strategy-list-blue {
        flex: 1;
        background-color: #1e1e2f;
        width: 50%;
        height: 250px;
        overflow-y: auto;
        margin-bottom: 20px;
        border-radius: 8px;
    }
    #strategy-list-yellow{
        box-shadow:0 0 10px yellow;
    }
    #strategy-list-blue{
        box-shadow:0 0 10px blue;
    }

    .strategy-item {
        padding: 8px;
        cursor: pointer;
        border-bottom: 1px solid #444;
        transition: background 0.2s;
    }

    .strategy-item:hover {
        background-color: #3a3a5a;
    }

    .strategy-item.selected {
        background-color: #4a90e2;
        color: #fff;
    }

    .buttons {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
    }

    button {
        flex: 1 1 45%;
        margin: 5px;
        padding: 10px;
        background-color: #3a3a5a;
        border: none;
        color: #e0e0e0;
        font-size: 14px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
    }

    button:hover:not(:disabled) {
        background-color: #4a4a7a;
    }

    button:disabled {
        opacity: 0.4;
        cursor: default;
    }
    </style>
</head>
<body>
    <div class="container">
        <h1>lampa lampa</h1>
        <div class="strategy-lists-container">
            <div id="strategy-list-yellow"></div>
            <div id="strategy-list-blue"></div>
        </div>

        <div class="buttons">
            <button id="create-btn">Create</button>
            <button id="open-btn" disabled>Open</button>
            <button id="delete-btn" disabled>Delete</button>
            <button id="select-btn" disabled>Select</button>
        </div>
    </div>
    <script src="../js/lib/js-yaml.min.js"></script>
    <script type="module" src="../js/selector_controller.js"></script>
</body>
</html>
