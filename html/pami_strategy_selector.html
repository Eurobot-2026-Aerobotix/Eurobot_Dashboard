<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategy Selector</title>
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/pami_selector_style.css">
    <link rel="icon" type="image/png" href="../resources/harissa.png">
</head>
<body>
    <button class="back-button" onclick="window.location.href='strategy_selector.html'">&#8592; Back</button>
    <div class="logo-container">
        <img src="../resources/AeRobotix.png" alt="AeRobotix Logo" class="logo">        
    </div>
    <center>
        <label id="current-strategy" style="font-weight: 700; color: #ffcc00;font-size:1.75em">-</label>
    </center>
    <div class="container">
        <div class="grid">
            <div class="square all-square">ALL</div>
            <div class="square test-square">TEST</div>
            <div class="square">1</div>
            <div class="square">2</div>
            <div class="square">3</div>
            <div class="square">4</div>
            <div class="square">5</div>
            <div class="square">6</div>
            <div class="square">N</div>
        </div>
    </div>
    <div id="pami-context-menu" class="context-menu hidden">

    </div>
    <script src="../js/config.js"></script>
    <script src="../js/lib/js-yaml.min.js"></script>
    <script type="module" src="../js/pami_strategy_selector_controller.js"></script>
</body>
</html>
