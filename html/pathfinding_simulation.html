<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathfinding Simulation</title>
    <link rel="stylesheet" href="../css/pathfinding.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Pathfinding Simulation</h1>
            <p>Interactive Map - 3m x 2m (3000 x 2000 pixels)</p>
        </div>

        <div class="content">
            <div class="map-container">
                <div class="map-wrapper" id="mapWrapper">
                    <img id="map" src="../resources/map.png" alt="Eurobot Map">
                    <!-- Markers will be added dynamically -->
                </div>

                <div class="orientation-selector" id="orientationSelector" style="display: none;">
                    <h4>Select Orientation</h4>
                    
                    <div class="orientation-grid">
                        <button class="orientation-btn" data-angle="180">↑</button>
                        <button class="orientation-btn" data-angle="135">↗</button>
                        <button class="orientation-btn" data-angle="90">→</button>
                        <button class="orientation-btn" data-angle="-135">↖</button>
                        <button class="orientation-btn" data-angle="0">●</button>
                        <button class="orientation-btn" data-angle="45">↘</button>
                        <button class="orientation-btn" data-angle="0">↓</button>
                        <button class="orientation-btn" data-angle="-45">↙</button>
                        <button class="orientation-btn" data-angle="-90">←</button>
                    </div>

                    <div class="orientation-input">
                        <label>Angle (°):</label>
                        <input type="number" id="orientationInput" min="-180" max="180" step="1" placeholder="0">
                    </div>

                    <button class="confirm-btn" id="confirmBtn">
                        ✓ Confirm & Send
                    </button>
                </div>
            </div>

            <div class="controls">
                <div class="button-group">
                    <button class="button start-btn" id="startPoseBtn">
                        🎯 Start Pose
                    </button>

                    <button class="button enemy-btn" id="enemyPoseBtn">
                        ⚠️ Enemy Pose
                    </button>

                    <button class="button goal-btn" id="goalPoseBtn">
                        🏁 Goal Pose
                    </button>

                    <button class="button find-path-btn" id="findPathBtn">
                        🔍 Find Path
                    </button>
                </div>

                <div class="info-panel">
                    <h3>Current Poses</h3>
                    
                    <div class="pose-info start-pose">
                        <h4>Start Position</h4>
                        <p id="startX">X: -</p>
                        <p id="startY">Y: -</p>
                        <p id="startTheta">θ: -</p>
                    </div>

                    <div class="pose-info enemy-pose">
                        <h4>Enemy Position</h4>
                        <p id="enemyX">X: -</p>
                        <p id="enemyY">Y: -</p>
                        <p id="enemyTheta">θ: -</p>
                    </div>

                    <div class="pose-info goal-pose">
                        <h4>Goal Position</h4>
                        <p id="goalX">X: -</p>
                        <p id="goalY">Y: -</p>
                        <p id="goalTheta">θ: -</p>
                    </div>
                </div>

                <div class="batch-selector">
                    <h4>🔢 Batch Selector</h4>
                    
                    <button class="batch-toggle-all" id="toggleAllBtn">
                        Toggle All Batches
                    </button>

                    <div class="batch-list" id="batchList">
                        <!-- Batch items will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/pathfinding.js"></script>
</body>
</html>
